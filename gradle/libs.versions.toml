[versions]
agp = "9.2.1"
kotlin = "2.4.10"
ksp = "2.3.2"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
room = "2.8.4"
coroutines = "1.11.0"
work = "2.11.2"
koin = "4.2.2"
retrofit = "3.0.0"
okhttp = "5.4.0"
junit = "4.13.2"
